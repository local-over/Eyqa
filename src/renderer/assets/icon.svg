<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    
    <!-- Convergence Nodes Vibrant Gradient (Inspired by Free Claude Code & Antigravity) -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="50%" stop-color="#af40ff" />
      <stop offset="100%" stop-color="#00c8ff" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af40ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Subtle ambient glow -->
  <circle cx="340" cy="256" r="140" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Multi-Provider Convergence Circuit (Free Claude Code Inspiration) -->
  <g fill="none" stroke="url(#streamGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="26" filter="url(#glow)">
    <!-- Top Provider Node Path -->
    <path d="M110 148h85c14 0 24 6 32 16l68 84c8 10 16 14 30 14h24"/>
    <!-- Center Provider Node Path -->
    <path d="M110 256h239"/>
    <!-- Bottom Provider Node Path -->
    <path d="M110 364h85c14 0 24-6 32-16l68-84c8-10 16-14 30-14h24"/>
  </g>

  <!-- 3 Left AI Provider Nodes (Free Models: Gemini, Groq, NVIDIA) -->
  <g fill="#ff7a18" filter="url(#glow)">
    <circle cx="110" cy="148" r="32"/>
    <circle cx="110" cy="256" r="32"/>
    <circle cx="110" cy="364" r="32"/>
  </g>
  <g fill="#ffffff">
    <circle cx="110" cy="148" r="14"/>
    <circle cx="110" cy="256" r="14"/>
    <circle cx="110" cy="364" r="14"/>
  </g>

  <!-- Central Unified Eyqa Agent Core Box (Antigravity & FCC Console) -->
  <rect x="330" y="196" width="120" height="120" rx="30" fill="#0d121e" stroke="url(#streamGrad)" stroke-width="22" filter="url(#glow)"/>
  
  <!-- Prompt Chevron / Eye Core -->
  <path d="M378 228l30 28-30 28" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="20"/>
</svg>
